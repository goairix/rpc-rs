[workspace]
members = ["interop/rust", "crates/*"]
resolver = "3"

[package]
name = "rpc-rs"
version = "0.1.0"
edition = "2024"
description = "Go-compatible service discovery and governance for tonic"

[features]
default = ["etcd"]
etcd = ["rpc-registry/etcd", "rpc-discovery/etcd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
thiserror = "2"
rpc-registry = { path = "crates/registry", default-features = false }
rpc-governance = { path = "crates/governance" }
rpc-discovery = { path = "crates/discovery", default-features = false }
tower = "0.5"
http = "1"
