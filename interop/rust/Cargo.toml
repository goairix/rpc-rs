[package]
name = "rpc-interop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rpc-rs = { path = "../.." }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-stream = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"
