[package]
name = "rpc-discovery"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Kept for manifests that explicitly requested this feature before etcd became built-in.
etcd = []

[dependencies]
rpc-governance = { path = "../governance" }
arc-swap = "1"
fastrand = "2"
http = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
rpc-naming = { path = "../naming" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time", "io-util"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tower = { version = "0.5", features = ["util", "buffer"] }

[dev-dependencies]
etcd-client = "0.18"
serde_json = "1"
tonic-health = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"
