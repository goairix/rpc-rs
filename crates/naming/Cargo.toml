[package]
name = "rpc-naming"
version = "0.1.0"
edition = "2024"
description = "Service naming contracts with static and etcd backends"

[features]
# Kept for manifests that explicitly requested this feature before etcd became built-in.
etcd = []

[dependencies]
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
etcd-client = { version = "0.18", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
